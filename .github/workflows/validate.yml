name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate module
        run: python scripts/validate.py

  odoo:
    name: odoo (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '18.0'
            without_demo: all
          - version: '19.0'
            without_demo: 'True'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and test in Odoo ${{ matrix.version }}
        run: |
          docker run --rm --network host --entrypoint odoo \
            -v "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            odoo:${{ matrix.version }} \
            --db_host=127.0.0.1 --db_user=odoo --db_password=odoo-test \
            -d makepay_test -i makepay_odoo --test-enable --test-tags /makepay_odoo \
            --stop-after-init --without-demo=${{ matrix.without_demo }} \
            --http-interface=127.0.0.1 --log-level=test
